<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xác Nhận IP & Chuyển Hướng</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 { font-size: 20px; margin-bottom: 10px; color: #38bdf8; }
    .desc { font-size: 14px; color: #cbd5e1; margin-bottom: 18px; line-height: 1.5; }
    .box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
      word-break: break-word;
    }
    .box.center { text-align: center; }
    .status-ok { color: #4ade80; font-weight: bold; }
    .status-err { color: #f87171; font-weight: bold; }
    .status-wait { color: #facc15; font-weight: bold; }
    .countdown {
      font-size: 28px;
      font-weight: bold;
      color: #facc15;
      margin-top: 8px;
    }
    .link-out {
      display: block;
      margin-top: 10px;
      word-break: break-all;
      color: #7dd3fc;
      font-size: 13px;
    }
    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      border-radius: 8px;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="titleText">🔍 Đang Kiểm Tra IP...</h1>
    <p class="desc" id="descText">Vui lòng chờ trong giây lát...</p>

    <div class="box" id="infoBox">
      <div>IP của bạn: <strong id="ipText">Đang kiểm tra...</strong></div>
      <div>Trạng thái: <span id="statusText" class="status-wait">Đang xác nhận...</span></div>
      <div id="detailText" style="margin-top: 6px; color: #cbd5e1; font-size: 13px;"></div>
      <div class="countdown" id="countdownBox" style="display: none;">
        Chuyển hướng sau <span id="secLeft">3</span>s
      </div>
      <a id="manualLink" class="link-out" href="#" style="display: none;">Bấm vào đây nếu không tự chuyển hướng</a>
    </div>

    <div style="text-align: center;">
      <a id="directFileBtn" class="btn" href="#" style="display: none;">Mở Link File Ngay</a>
      <button id="retryBtn" class="btn" type="button" style="display: none;" onclick="window.location.reload()">Thử Lại</button>
    </div>
  </div>

  <script>
    const API_KEY = "cf5e995ca4e04a2e9980c49b1683593b";
    const CREATE_API_BASE = "https://manager.trafficso1.com/api/cong-khai/tao-lien-ket";
    const TASK_URL_TEMPLATE = "https://trafficso1.com/{id}";

    // Link API của bot (trỏ tới cổng WEB_VIEW_PORT của botmoney.py qua HTTPS)
    const BOT_API_BASE = "https://your-bot-domain.com/api/view";

    // Danh sách link file đích (chọn ngẫu nhiên khi chuyển hướng)
    const FILE_DOWNLOAD_URLS = [
      "https://zufile.com/f/2j7UH4cQCk",
      "https://zufile.com/f/4utKAAP8GR",
      "https://zufile.com/f/cZdROX26fp",
      "https://zufile.com/f/i0lkGMborW",
      "https://zufile.com/f/xx3YwdQXPW",
      "https://zufile.com/f/RQO1zR1Js8",
      "https://zufile.com/f/rJjhWV3PjH",
      "https://zufile.com/f/qyrLWSDpvc",
      "https://zufile.com/f/1ub80jRNNp",
      "https://zufile.com/f/fnfbj6CuCG",
      "https://zufile.com/f/bQhQ6ba92D",
      "https://zufile.com/f/lT8Q8FOSh8",
      "https://zufile.com/f/BA5dE7FWBw",
      "https://zufile.com/f/R42CpR1B0C",
      "https://zufile.com/f/huDC40AsZA",
      "https://zufile.com/f/0YlAdFv1w9",
      "https://zufile.com/f/6MlbLOuyig",
      "https://zufile.com/f/Gkpv5LIyva"
    ];

    const REDIRECT_SECONDS = 3;
    const USED_IP_STORAGE_KEY = "trafficso1_used_ips_v1";

    const titleText = document.getElementById("titleText");
    const descText = document.getElementById("descText");
    const infoBox = document.getElementById("infoBox");
    const ipText = document.getElementById("ipText");
    const statusText = document.getElementById("statusText");
    const detailText = document.getElementById("detailText");
    const countdownBox = document.getElementById("countdownBox");
    const secLeftEl = document.getElementById("secLeft");
    const manualLink = document.getElementById("manualLink");
    const directFileBtn = document.getElementById("directFileBtn");
    const retryBtn = document.getElementById("retryBtn");

    function getRandomFileUrl() {
      const idx = Math.floor(Math.random() * FILE_DOWNLOAD_URLS.length);
      return FILE_DOWNLOAD_URLS[idx];
    }

    function showError(statusMsg, detailMsg) {
      statusText.textContent = statusMsg;
      statusText.className = "status-err";
      detailText.textContent = detailMsg || "";
      retryBtn.style.display = "inline-block";
    }

    function getUsedIps() {
      try {
        return JSON.parse(localStorage.getItem(USED_IP_STORAGE_KEY) || "[]");
      } catch (_) {
        return [];
      }
    }

    function saveUsedIp(ip) {
      const list = getUsedIps();
      if (!list.includes(ip)) {
        list.push(ip);
        localStorage.setItem(USED_IP_STORAGE_KEY, JSON.stringify(list));
      }
    }

    async function fetchWithTimeout(url, timeoutMs = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        });
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchClientIp() {
      const sources = [
        async () => {
          const r = await fetchWithTimeout("https://api.ipify.org?format=json");
          const d = await r.json();
          return d && d.ip ? String(d.ip).trim() : "";
        },
        async () => {
          const r = await fetchWithTimeout("https://api64.ipify.org?format=json");
          const d = await r.json();
          return d && d.ip ? String(d.ip).trim() : "";
        },
        async () => {
          const r = await fetchWithTimeout("https://ipwho.is/");
          const d = await r.json();
          return d && d.success && d.ip ? String(d.ip).trim() : "";
        }
      ];

      for (const getIp of sources) {
        try {
          const ip = await getIp();
          if (ip) return ip;
        } catch (_) {}
      }
      return "";
    }

    function buildTrafficLink(parsed, rawText, forbiddenUrl) {
      if (parsed && typeof parsed === "object") {
        const candidates = [parsed, parsed.data].filter(Boolean);
        for (const obj of candidates) {
          if (typeof obj !== "object") continue;
          for (const key of ["short_url", "shortenedUrl", "short_link", "shortLink", "task_url", "traffic_url", "url", "link"]) {
            const val = obj[key];
            if (
              typeof val === "string" &&
              /^https?:\/\//i.test(val.trim()) &&
              val.trim() !== forbiddenUrl &&
              !val.includes("step=nhanfile")
            ) {
              return val.trim();
            }
          }
          if (obj.id !== undefined && obj.id !== null && String(obj.id).trim() !== "") {
            return TASK_URL_TEMPLATE.replace("{id}", encodeURIComponent(String(obj.id).trim()));
          }
        }
      }

      if (typeof rawText === "string") {
        const idMatch = rawText.match(/"id"\s*:\s*"?([^",\s}]+)"?/);
        if (idMatch && idMatch[1]) {
          return TASK_URL_TEMPLATE.replace("{id}", encodeURIComponent(idMatch[1].trim()));
        }
      }

      return "";
    }

    async function notifyBot(ip, fileUrl, chatId) {
      if (!BOT_API_BASE || BOT_API_BASE.includes("your-bot-domain.com")) return;
      try {
        await fetch(`${BOT_API_BASE}/notify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          keepalive: true,
          body: JSON.stringify({
            ip,
            file_url: fileUrl,
            chat_id: chatId || "",
            page_url: window.location.href
          })
        });
      } catch (_) {}
    }

    function startFileCountdown(ip, selectedFileUrl) {
      infoBox.classList.add("center");
      titleText.textContent = "✅ IP Đã Được Xác Nhận";
      titleText.style.color = "#4ade80";
      descText.textContent = "Vượt link hoàn tất. Đang chuyển hướng đến trang nhận file...";
      ipText.textContent = ip;
      statusText.textContent = "Đã xác nhận IP";
      statusText.className = "status-ok";
      detailText.textContent = `Link nhận file: ${selectedFileUrl}`;

      directFileBtn.href = selectedFileUrl;
      directFileBtn.style.display = "inline-block";

      let remaining = REDIRECT_SECONDS;
      secLeftEl.textContent = remaining;
      countdownBox.style.display = "block";

      const interval = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(interval);
          window.location.href = selectedFileUrl;
        } else {
          secLeftEl.textContent = remaining;
        }
      }, 1000);
    }

    async function runStep2ReceiveFile(passedIp, chatId) {
      titleText.textContent = "🔍 Đang Xác Nhận IP Nhận File...";
      descText.textContent = "Hệ thống đang kiểm tra IP và chuyển hướng đến trang nhận file.";

      const detectedIp = await fetchClientIp();
      const finalIp = detectedIp || passedIp;

      if (!finalIp) {
        ipText.textContent = "Không rõ";
        showError("Không xác nhận được IP", "Vui lòng kiểm tra kết nối mạng hoặc thử lại.");
        return;
      }

      ipText.textContent = finalIp;

      if (passedIp && detectedIp && passedIp !== detectedIp) {
        showError(
          "IP không khớp phiên ban đầu",
          `IP lúc tạo link: ${passedIp} | IP hiện tại: ${detectedIp}`
        );
        return;
      }

      const selectedFileUrl = getRandomFileUrl();
      await notifyBot(finalIp, selectedFileUrl, chatId);
      startFileCountdown(finalIp, selectedFileUrl);
    }

    async function runStep1Gate(chatId) {
      titleText.textContent = "🌐 Kiểm Tra IP & Tạo Link Vượt Link";
      descText.textContent = "Xác nhận IP -> Tạo link Traffic so1 trỏ về phần nhận file -> Vượt link xong mới nhận file.";

      try {
        if (!/^https?:\/\//i.test(window.location.origin)) {
          throw new Error("Hãy mở trang qua http:// hoặc https://.");
        }

        const ip = await fetchClientIp();
        if (!ip) throw new Error("Không thể lấy địa chỉ IP của bạn.");
        ipText.textContent = ip;

        if (getUsedIps().includes(ip)) {
          showError("IP đã sử dụng", "IP này đã được xác nhận trước đó. Vui lòng đổi IP khác.");
          return;
        }

        statusText.textContent = "IP hợp lệ — Đang tạo link vượt link Traffic so1...";
        statusText.className = "status-ok";

        const chatParam = chatId ? `&chat_id=${encodeURIComponent(chatId)}` : "";
        const receiveFileUrl = `${window.location.origin}${window.location.pathname}?step=nhanfile&ip=${encodeURIComponent(ip)}${chatParam}&ts=${Date.now()}`;
        const apiUrl = `${CREATE_API_BASE}?apikey=${encodeURIComponent(API_KEY)}&url=${encodeURIComponent(receiveFileUrl)}`;

        const res = await fetchWithTimeout(apiUrl, 10000);
        const rawText = await res.text();

        let parsed = null;
        try {
          parsed = JSON.parse(rawText);
        } catch (_) {}

        const trafficLink = buildTrafficLink(parsed, rawText, receiveFileUrl);

        if (!trafficLink) {
          showError(
            `Chưa lấy được link vượt link (HTTP ${res.status})`,
            rawText ? `Phản hồi: ${rawText.slice(0, 260)}` : "Phản hồi rỗng."
          );
          return;
        }

        saveUsedIp(ip);
        detailText.textContent = "Đã tạo link vượt link. Đang chuyển hướng...";
        manualLink.href = trafficLink;
        manualLink.textContent = trafficLink;
        manualLink.style.display = "block";

        window.location.href = trafficLink;
      } catch (err) {
        const msg = err && err.name === "AbortError"
          ? "Hết thời gian chờ phản hồi từ máy chủ API."
          : "Trình duyệt chặn gọi fetch trực tiếp tới manager.trafficso1.com (CORS) hoặc mất kết nối. Chỉ có thể gọi ẩn danh từ server/backend.";
        showError("Lỗi gọi API tạo link", msg);
      }
    }

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const step = (params.get("step") || "").trim().toLowerCase();
      const passedIp = (params.get("ip") || "").trim();
      const chatId = (params.get("chat_id") || "").trim();

      if (step === "nhanfile") {
        runStep2ReceiveFile(passedIp, chatId);
      } else {
        runStep1Gate(chatId);
      }
    })();
  </script>
</body>
</html>
