<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>....</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }
    .card h1 { font-size: 18px; margin-bottom: 6px; }
    .card .desc { font-size: 13px; color: #94a3b8; margin-bottom: 14px; }
    .card .box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
    }
    .status-wait { color: #facc15; font-weight: bold; }
    .status-err { color: #f87171; font-weight: bold; }
    .status-ok { color: #4ade80; font-weight: bold; }
    .card .countdown { margin-top: 8px; color: #38bdf8; font-weight: bold; }
    .card .link-out {
      display: inline-block;
      margin-top: 8px;
      color: #60a5fa;
      word-break: break-all;
      font-size: 12px;
    }
    .card .btn {
      margin-top: 14px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 0;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="app" aria-hidden="true"></div>

  <div class="card">
    <h1 id="titleText">🔍 ...</h1>
    <p class="desc" id="descText">Vui lòng chờ trong giây lát...</p>

    <div class="box" id="infoBox">
      <div>IP của bạn: <strong id="ipText">Đang kiểm tra...</strong></div>
      <div>Trạng thái: <span id="statusText" class="status-wait">Đang xác nhận...</span></div>
      <div id="detailText" style="margin-top: 6px; color: #cbd5e1; font-size: 13px;"></div>
      <div class="countdown" id="countdownBox" style="display: none;">
        Chuyển hướng sau <span id="secLeft">3</span>s
      </div>
      <a id="manualLink" class="link-out" href="#" style="display: none;">Bấm vào đây nếu không tự chuyển hướng</a>
    </div>

    <div style="text-align: center;">
      <a id="directFileBtn" class="btn" href="#" style="display: none;">Mở Link File Ngay</a>
      <button id="retryBtn" class="btn" type="button" style="display: none;" onclick="window.location.reload()">Thử Lại</button>
    </div>
  </div>

  <script>
    const API_KEY = "cf5e995ca4e04a2e9980c49b1683593b";
    const CREATE_API_BASE = "https://manager.trafficso1.com/api/cong-khai/tao-lien-ket";
    const TASK_URL_TEMPLATE = "https://trafficso1.com/{id}";

    // Tùy chọn kiểm tra IP trùng qua server/API (để trống "" nếu chỉ dùng localStorage)
    // Nếu có API: GET `${IP_CHECK_API}?ip=...` trả về { "used": true/false } và POST lưu IP
    const IP_CHECK_API = "";

    // Thời gian hết hạn chặn IP trùng tính bằng giờ (0 = chặn vĩnh viễn trên localStorage)
    const IP_BLOCK_HOURS = 24;

    // Cấu hình Bot Telegram
    const BOT_TOKEN = "9250122094:AAEHNtY6i0gGfzv1V_KfgM_hBvkLilbszog";
    const ADMIN_CHAT_ID = "7815348177";

    // Danh sách link file đích (chọn ngẫu nhiên khi chuyển hướng)
    const FILE_DOWNLOAD_URLS = [
      "https://zufile.com/f/2j7UH4cQCk",
      "https://zufile.com/f/4utKAAP8GR",
      "https://zufile.com/f/cZdROX26fp",
      "https://zufile.com/f/i0lkGMborW",
      "https://zufile.com/f/xx3YwdQXPW",
      "https://zufile.com/f/RQO1zR1Js8",
      "https://zufile.com/f/rJjhWV3PjH",
      "https://zufile.com/f/qyrLWSDpvc",
      "https://zufile.com/f/1ub80jRNNp",
      "https://zufile.com/f/fnfbj6CuCG",
      "https://zufile.com/f/bQhQ6ba92D",
      "https://zufile.com/f/lT8Q8FOSh8",
      "https://zufile.com/f/BA5dE7FWBw",
      "https://zufile.com/f/R42CpR1B0C",
      "https://zufile.com/f/huDC40AsZA",
      "https://zufile.com/f/0YlAdFv1w9",
      "https://zufile.com/f/6MlbLOuyig",
      "https://zufile.com/f/Gkpv5LIyva"
    ];

    const REDIRECT_SECONDS = 3;
    const USED_IP_STORAGE_KEY = "trafficso1_used_ips_v2";

    const titleText = document.getElementById("titleText");
    const descText = document.getElementById("descText");
    const ipText = document.getElementById("ipText");
    const statusText = document.getElementById("statusText");
    const detailText = document.getElementById("detailText");
    const countdownBox = document.getElementById("countdownBox");
    const secLeftEl = document.getElementById("secLeft");
    const manualLink = document.getElementById("manualLink");
    const directFileBtn = document.getElementById("directFileBtn");
    const retryBtn = document.getElementById("retryBtn");

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normalizeUserContext() {
      const params = new URLSearchParams(window.location.search);
      const step = (params.get("step") || "").trim().toLowerCase();
      const passedIp = (params.get("ip") || "").trim();
      const rawChatId = (params.get("chat_id") || params.get("user_id") || params.get("id") || "").trim();
      const chatId = /^\d+$/.test(rawChatId) ? rawChatId : "";
      const userName = (params.get("user_name") || params.get("name") || "").trim();
      const sessionId = (params.get("sid") || "").trim();
      return { step, passedIp, chatId, userName, sessionId };
    }

    function buildSafeCallbackData(prefix, chatId, refId) {
      const cid = String(chatId || "").trim();
      const sid = String(refId || "").trim().slice(0, 32);
      const combined = cid ? `${prefix}:${cid}|${sid}` : `${prefix}:${sid}`;
      return combined.length <= 64 ? combined : `${prefix}:${sid}`.slice(0, 64);
    }

    function getRandomFileUrl() {
      const idx = Math.floor(Math.random() * FILE_DOWNLOAD_URLS.length);
      return FILE_DOWNLOAD_URLS[idx];
    }

    function setStatus(type, msg) {
      if (!statusText) return;
      statusText.className = type === "err" ? "status-err" : type === "ok" ? "status-ok" : "status-wait";
      statusText.textContent = msg;
    }

    function showError(statusMsg, detailMsg, hideRetry = false) {
      setStatus("err", statusMsg);
      if (detailText) detailText.textContent = detailMsg || "";
      if (retryBtn) retryBtn.style.display = hideRetry ? "none" : "inline-block";
    }

    function getUsedIpMap() {
      try {
        const raw = JSON.parse(localStorage.getItem(USED_IP_STORAGE_KEY) || "{}");
        if (Array.isArray(raw)) {
          const map = {};
          raw.forEach(ip => { map[ip] = Date.now(); });
          return map;
        }
        return raw && typeof raw === "object" ? raw : {};
      } catch (_) {
        return {};
      }
    }

    function isIpBlockedLocally(ip) {
      const map = getUsedIpMap();
      const savedAt = map[ip];
      if (!savedAt) return false;
      if (!IP_BLOCK_HOURS || IP_BLOCK_HOURS <= 0) return true;
      const elapsedHours = (Date.now() - savedAt) / (1000 * 60 * 60);
      if (elapsedHours >= IP_BLOCK_HOURS) {
        delete map[ip];
        localStorage.setItem(USED_IP_STORAGE_KEY, JSON.stringify(map));
        return false;
      }
      return true;
    }

    function saveUsedIpLocally(ip) {
      if (!ip) return;
      const map = getUsedIpMap();
      map[ip] = Date.now();
      localStorage.setItem(USED_IP_STORAGE_KEY, JSON.stringify(map));
    }

    async function checkDuplicateIp(ip) {
      if (isIpBlockedLocally(ip)) {
        return true;
      }

      if (IP_CHECK_API) {
        try {
          const separator = IP_CHECK_API.includes("?") ? "&" : "?";
          const res = await fetchWithTimeout(`${IP_CHECK_API}${separator}ip=${encodeURIComponent(ip)}`, 6000);
          if (res.ok) {
            const data = await res.json();
            if (data && data.used === true) {
              saveUsedIpLocally(ip);
              return true;
            }
          }
        } catch (_) {}
      }

      return false;
    }

    async function markIpUsedRemote(ip, chatId, userName) {
      saveUsedIpLocally(ip);
      if (!IP_CHECK_API) return;
      try {
        await fetch(IP_CHECK_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          keepalive: true,
          body: JSON.stringify({ ip, chat_id: chatId || "", user_name: userName || "" })
        });
      } catch (_) {}
    }

    async function fetchWithTimeout(url, timeoutMs = 8000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        });
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchClientIp() {
      const sources = [
        async () => {
          const r = await fetchWithTimeout("https://api.ipify.org?format=json");
          const d = await r.json();
          return d && d.ip ? String(d.ip).trim() : "";
        },
        async () => {
          const r = await fetchWithTimeout("https://api64.ipify.org?format=json");
          const d = await r.json();
          return d && d.ip ? String(d.ip).trim() : "";
        },
        async () => {
          const r = await fetchWithTimeout("https://ipwho.is/");
          const d = await r.json();
          return d && d.success && d.ip ? String(d.ip).trim() : "";
        }
      ];

      for (const getIp of sources) {
        try {
          const ip = await getIp();
          if (ip) return ip;
        } catch (_) {}
      }
      return "";
    }

    function buildTrafficLink(parsed, rawText, forbiddenUrl) {
      if (parsed && typeof parsed === "object") {
        const candidates = [parsed, parsed.data].filter(Boolean);
        for (const obj of candidates) {
          if (typeof obj !== "object") continue;
          for (const key of ["short_url", "shortenedUrl", "short_link", "shortLink", "task_url", "traffic_url", "url", "link"]) {
            const val = obj[key];
            if (
              typeof val === "string" &&
              /^https?:\/\//i.test(val.trim()) &&
              val.trim() !== forbiddenUrl &&
              !val.includes("step=nhanfile")
            ) {
              return val.trim();
            }
          }
          if (obj.id !== undefined && obj.id !== null && String(obj.id).trim() !== "") {
            return TASK_URL_TEMPLATE.replace("{id}", encodeURIComponent(String(obj.id).trim()));
          }
        }
      }

      if (typeof rawText === "string") {
        const idMatch = rawText.match(/"id"\s*:\s*"?([^",\s}]+)"?/);
        if (idMatch && idMatch[1]) {
          return TASK_URL_TEMPLATE.replace("{id}", encodeURIComponent(idMatch[1].trim()));
        }
      }

      return "";
    }

    async function sendTelegramNotice(targetChatId, text, replyMarkup = null) {
      if (!BOT_TOKEN || !targetChatId) return false;
      try {
        const payload = {
          chat_id: targetChatId,
          text,
          parse_mode: "HTML",
          disable_web_page_preview: true
        };
        if (replyMarkup) payload.reply_markup = replyMarkup;

        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          keepalive: true,
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        return Boolean(res.ok && data && data.ok);
      } catch (_) {
        return false;
      }
    }

    async function notifyAdminOnIpChecked(ip, stageLabel, chatId, userName) {
      if (!ip) return;
      const timeStr = new Date().toLocaleString("vi-VN");
      const adminMsg =
        `🛡️ <b>CHECK IP</b>\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `🌐 IP: <code>${escapeHtml(ip)}</code>\n` +
        `📌 Trạng thái: ${escapeHtml(stageLabel)}\n` +
        (chatId ? `🆔 ID người dùng: <code>${escapeHtml(chatId)}</code>\n` : "") +
        (userName ? `👤 Tên người dùng: <b>${escapeHtml(userName)}</b>\n` : "") +
        `🕒 Thời gian: <i>${escapeHtml(timeStr)}</i>`;

      await sendTelegramNotice(ADMIN_CHAT_ID, adminMsg);
    }

    async function sendAdminApprovalRequest({ sessionId, currentIp, passedIp, chatId, userName, fileUrl }) {
      const refId = sessionId || currentIp;
      const text =
        `🔔 <b>CÓ VIEW CẦN DUYỆT chicong ơiiii</b>\n` +
        `━━━━━━━━━━━━━━━━━━━━\n` +
        `✅ IP: <code>${escapeHtml(currentIp)}</code>` +
        (passedIp && passedIp !== currentIp ? ` (IP ban đầu: <code>${escapeHtml(passedIp)}</code>)` : "") + `\n` +
        (chatId ? `🆔 ID người dùng: <code>${escapeHtml(chatId)}</code>\n` : "") +
        (userName ? `👤 Tên người dùng: <b>${escapeHtml(userName)}</b>\n` : "") +
        `🔑 Session: <code>${escapeHtml(sessionId || "N/A")}</code>\n` +
        `📁 Link file: ${escapeHtml(fileUrl)}\n` +
        `🕒 Thời gian: <i>${escapeHtml(new Date().toLocaleString("vi-VN"))}</i>`;

      const keyboard = {
        inline_keyboard: [[
          { text: "✅ Duyệt view", callback_data: buildSafeCallbackData("approve", chatId, refId) },
          { text: "❌ Từ chối", callback_data: buildSafeCallbackData("reject", chatId, refId) }
        ]]
      };

      const sentAdmin = await sendTelegramNotice(ADMIN_CHAT_ID, text, keyboard);
      if (chatId && String(chatId).trim() !== String(ADMIN_CHAT_ID)) {
        await sendTelegramNotice(
          String(chatId).trim(),
          `✅ <b>Vượt link thành công!</b>\n` +
          (userName ? `👤 Tên người dùng: <b>${escapeHtml(userName)}</b>\n` : "") +
          `🌐 IP: <code>${escapeHtml(currentIp)}</code>\n` +
          `📁 Link file: ${escapeHtml(fileUrl)}`
        );
      }
      return { ok: sentAdmin, viewId: sessionId, error: "" };
    }

    function startFileCountdown(ip, selectedFileUrl) {
      if (titleText) titleText.textContent = "File hack game";
      if (ipText) ipText.textContent = ip;
      setStatus("ok", "đang chuyển hướng");
      if (detailText) detailText.textContent = `Link nhận file: ${selectedFileUrl}`;
      if (directFileBtn) {
        directFileBtn.href = selectedFileUrl;
        directFileBtn.style.display = "inline-block";
      }
      if (countdownBox) countdownBox.style.display = "block";

      let remaining = REDIRECT_SECONDS;
      if (secLeftEl) secLeftEl.textContent = remaining;

      const timer = setInterval(() => {
        remaining -= 1;
        if (secLeftEl) secLeftEl.textContent = Math.max(0, remaining);
        if (remaining <= 0) {
          clearInterval(timer);
          window.location.replace(selectedFileUrl);
        }
      }, 1000);
    }

    async function runStep2ReceiveFile(passedIp, chatId, userName, sessionId) {
      if (titleText) titleText.textContent = "File crack no key";
      if (descText) descText.textContent = "đợi chút đang xác nhận";

      const detectedIp = await fetchClientIp();
      const finalIp = detectedIp || passedIp;

      if (!finalIp) {
        if (ipText) ipText.textContent = "Không rõ";
        showError("Không xác nhận được IP", "Vui lòng kiểm tra kết nối mạng hoặc thử lại.");
        return;
      }

      if (ipText) ipText.textContent = finalIp;
      await markIpUsedRemote(finalIp, chatId, userName);
      await notifyAdminOnIpChecked(finalIp, "Xác nhận IP nhận file", chatId, userName);

      const selectedFileUrl = getRandomFileUrl();
      await sendAdminApprovalRequest({
        sessionId,
        currentIp: finalIp,
        passedIp,
        chatId,
        userName,
        fileUrl: selectedFileUrl
      });

      startFileCountdown(finalIp, selectedFileUrl);
    }

    async function runStep1Gate(chatId, userName) {
      if (titleText) titleText.textContent = "File crack no key";
      if (descText) descText.textContent = "Đang kiểm tra IP trước khi tạo link...";

      try {
        if (!/^https?:\/\//i.test(window.location.origin)) {
          throw new Error("Hãy mở trang qua http:// hoặc https://.");
        }

        const ip = await fetchClientIp();
        if (!ip) throw new Error("Không thể lấy địa chỉ IP của bạn.");
        if (ipText) ipText.textContent = ip;

        // Check IP trùng ngay khi vào link -> chặn luôn, không tạo link vượt
        const isDuplicate = await checkDuplicateIp(ip);
        if (isDuplicate) {
          await notifyAdminOnIpChecked(ip, "Chặn IP trùng khi vào link", chatId, userName);
          showError(
            "IP đã bị trùng / đã sử dụng",
            "IP này đã từng vào hoặc sử dụng trước đó nên hệ thống không tạo link vượt cho bạn.",
            true
          );
          return;
        }

        // Lưu IP ngay khi qua bước kiểm tra đầu để tránh mở nhiều tab/tải lại liên tục tạo nhiều link
        await markIpUsedRemote(ip, chatId, userName);
        await notifyAdminOnIpChecked(ip, "IP hợp lệ — Đang tạo link", chatId, userName);

        setStatus("wait", "IP hợp lệ — Đang tạo link vượt link Traffic so1...");

        const sessionId = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        const chatParam = chatId ? `&chat_id=${encodeURIComponent(chatId)}` : "";
        const nameParam = userName ? `&user_name=${encodeURIComponent(userName)}` : "";
        const sidParam = `&sid=${encodeURIComponent(sessionId)}`;
        const receiveFileUrl = `${window.location.origin}${window.location.pathname}?step=nhanfile&ip=${encodeURIComponent(ip)}${chatParam}${nameParam}${sidParam}&ts=${Date.now()}`;
        const apiUrl = `${CREATE_API_BASE}?apikey=${encodeURIComponent(API_KEY)}&url=${encodeURIComponent(receiveFileUrl)}`;

        const res = await fetchWithTimeout(apiUrl, 10000);
        const rawText = await res.text();

        let parsed = null;
        try {
          parsed = JSON.parse(rawText);
        } catch (_) {}

        const trafficLink = buildTrafficLink(parsed, rawText, receiveFileUrl);

        if (!trafficLink) {
          showError(
            `Chưa lấy được link vượt link (HTTP ${res.status})`,
            rawText ? `Phản hồi: ${rawText.slice(0, 260)}` : "Phản hồi rỗng."
          );
          return;
        }

        if (detailText) detailText.textContent = "Đã tạo link vượt link. Đang chuyển hướng...";
        if (manualLink) {
          manualLink.href = trafficLink;
          manualLink.textContent = trafficLink;
          manualLink.style.display = "inline-block";
        }

        window.location.replace(trafficLink);
      } catch (err) {
        const msg = err && err.name === "AbortError"
          ? "Hết thời gian chờ phản hồi từ máy chủ API."
          : "Trình duyệt chặn gọi fetch trực tiếp tới manager.trafficso1.com (CORS) hoặc mất kết nối. Chỉ có thể gọi ẩn danh từ server/backend.";
        showError("Lỗi gọi API tạo link", msg);
      }
    }

    (function init() {
      const { step, passedIp, chatId, userName, sessionId } = normalizeUserContext();
      if (step === "nhanfile") {
        runStep2ReceiveFile(passedIp, chatId, userName, sessionId);
      } else {
        runStep1Gate(chatId, userName);
      }
    })();
  </script>
</body>
</html>
